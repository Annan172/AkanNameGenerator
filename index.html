<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find out your Akan name</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 <h1>AKAN NAME GENERATOR</h1>
    <p>
        Enter your birthdate and select your gender to discover your Akan name.<br>
        Akan names are based on the day of the week a person was born.
    </p>
<form id="AkanForm">
    <label for="birthdate">DateOfBirth:</label><br>
        <input type="date" id="birthdate" name="birthdate"><br><br>

<label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">MALE</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">FEMALE</label><br><br>
    <button id="submitBtn">Submit</button>
</form>
      <h3>Your Akan Name</h3>
    <p id="akan-name">
        Your Akan name will appear here.
    </p>
    <script src="script.js"></script>

</body>
</html>
